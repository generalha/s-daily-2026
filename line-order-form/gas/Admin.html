<style>
  :root {
    --green: #06c755; --green-dark: #05a648;
    --bg: #f4f6f5; --card: #fff; --text: #222; --muted: #777;
    --line: #e3e6e4; --accent: #ff6b35;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--text); padding-bottom: 40px;
  }
  header {
    background: #2b3a33; color: #fff; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 1.05em; }
  .reload-btn {
    background: rgba(255,255,255,.15); color: #fff; border: none;
    padding: 8px 14px; border-radius: 999px; font-size: .8em; cursor: pointer;
  }
  .tabs {
    display: flex; background: #fff; border-bottom: 1px solid var(--line);
    position: sticky; top: 52px; z-index: 9;
  }
  .tab {
    flex: 1; text-align: center; padding: 12px 4px; font-size: .85em;
    color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent;
  }
  .tab.active { color: var(--green-dark); border-bottom-color: var(--green); font-weight: 700; }
  main { max-width: 720px; margin: 0 auto; padding: 12px; }

  .filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .filters select, .filters input {
    padding: 9px 10px; font-size: .85em; border: 1px solid var(--line);
    border-radius: 8px; background: #fff;
  }
  .filters input { flex: 1; min-width: 140px; }

  .order-card {
    background: var(--card); border-radius: 12px; padding: 14px;
    margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .oc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .oc-id { font-size: .78em; color: var(--muted); }
  .oc-name { font-weight: 700; font-size: 1em; margin-top: 2px; }
  .oc-line { font-size: .78em; color: var(--muted); }
  .oc-items { margin: 10px 0; font-size: .87em; }
  .oc-items li {
    list-style: none; display: flex; justify-content: space-between;
    padding: 4px 0; border-bottom: 1px dashed var(--line);
  }
  .oc-total { text-align: right; font-weight: 700; color: var(--accent); font-size: .95em; margin-top: 6px; }
  .oc-note { font-size: .78em; background: #fffbe8; padding: 6px 8px; border-radius: 6px; margin-top: 6px; }
  .oc-meta { font-size: .72em; color: var(--muted); margin-top: 6px; }
  .status-select {
    padding: 8px 10px; font-size: .85em; border-radius: 8px;
    border: 1px solid var(--line); background: #fff; cursor: pointer;
  }
  .st-未対応 { background: #fdecea; border-color: #f5c6c0; }
  .st-入金確認済 { background: #fff8e1; border-color: #f2dd9a; }
  .st-梱包済 { background: #e3f2fd; border-color: #a9d3f5; }
  .st-受渡済 { background: #e8f5e9; border-color: #b2dfb5; }
  .st-キャンセル { background: #eee; color: #999; }

  .badge {
    display: inline-block; font-size: .68em; padding: 2px 8px;
    border-radius: 999px; background: #eee; color: #666; margin-left: 6px;
  }
  .badge.admin { background: #fff3cd; color: #7a5d00; }
  .badge.custom { background: #fdecea; color: #b3261e; }

  /* 梱包リスト */
  .pack-card {
    background: var(--card); border-radius: 12px; padding: 14px;
    margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
    border-left: 5px solid var(--green);
  }
  .pack-card.packed { border-left-color: #90caf9; opacity: .65; }
  .pack-name { font-weight: 700; font-size: 1.05em; }
  .pack-items { margin-top: 8px; }
  .pack-items li {
    list-style: none; font-size: .95em; padding: 6px 0;
    border-bottom: 1px dashed var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .pack-qty { font-weight: 700; font-size: 1.1em; }
  .pack-done-btn {
    margin-top: 10px; width: 100%; padding: 11px; font-size: .9em; font-weight: 700;
    border: none; border-radius: 8px; background: var(--green); color: #fff; cursor: pointer;
  }
  .pack-done-btn:disabled { background: #ccc; }

  /* 集計 */
  .sum-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; font-size: .88em; }
  .sum-table th { background: #2b3a33; color: #fff; padding: 10px; font-size: .85em; text-align: left; }
  .sum-table td { padding: 10px; border-bottom: 1px solid var(--line); }
  .sum-table td:last-child, .sum-table th:last-child { text-align: right; }

  /* 注文番号呼び出し */
  .lookup {
    display: flex; gap: 8px; margin-bottom: 12px;
    background: #fff; padding: 10px; border-radius: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .lookup input {
    flex: 1; padding: 10px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 8px;
  }
  .lookup button {
    padding: 10px 16px; font-size: .85em; font-weight: 700;
    border: none; border-radius: 8px; background: #2b3a33; color: #fff; cursor: pointer;
    white-space: nowrap;
  }
  .edit-btn {
    margin-top: 8px; padding: 8px 14px; font-size: .8em;
    border: 1px solid var(--green); color: var(--green-dark); background: #fff;
    border-radius: 999px; cursor: pointer;
  }

  /* 修正モーダル */
  .overlay {
    display: none; position: fixed; inset: 0; z-index: 40;
    background: rgba(0,0,0,.5); padding: 16px;
    align-items: center; justify-content: center;
  }
  .overlay.show { display: flex; }
  .modal {
    background: #fff; border-radius: 14px; padding: 18px;
    width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto;
  }
  .modal h3 { font-size: 1em; margin-bottom: 12px; text-align: center; }
  .modal label { display: block; font-size: .78em; color: var(--muted); margin: 10px 0 4px; }
  .modal input[type=text], .modal input[type=tel], .modal textarea, .modal select {
    width: 100%; padding: 10px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 8px; background: #fafafa;
  }
  .e-row {
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; margin-bottom: 8px; background: #fbfcfb;
  }
  .e-row .e-sub { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .e-row .e-qty { width: 80px !important; text-align: center; }
  .e-row .e-price { flex: 1; }
  .e-row .e-price-fixed {
    flex: 1; font-size: .85em; color: var(--accent); font-weight: 700; padding: 10px 4px;
  }
  .e-row .e-del {
    border: none; background: none; color: #c33; font-size: 1.2em; padding: 6px; cursor: pointer;
  }
  .e-row .e-name { margin-top: 8px; }
  .e-add-btn {
    width: 100%; padding: 10px; font-size: .85em;
    border: 1px dashed var(--green); color: var(--green-dark);
    background: #fff; border-radius: 8px; cursor: pointer;
  }
  .e-total { text-align: right; font-weight: 700; color: var(--accent); margin-top: 10px; }
  .modal .btns { display: flex; gap: 10px; margin-top: 16px; }
  .modal .btns button { flex: 1; padding: 12px; border-radius: 999px; font-size: .95em; cursor: pointer; }
  .btn-back { border: 1px solid var(--line); background: #fff; }
  .btn-ok { border: none; background: var(--green); color: #fff; font-weight: 700; }
  .btn-ok:disabled { background: #bbb; }
  .modal .hint { font-size: .72em; color: var(--muted); margin-top: 4px; }

  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: .85em; }
  .loading { text-align: center; padding: 40px 0; color: var(--muted); font-size: .85em; }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 10px;
    border: 3px solid var(--line); border-top-color: var(--green);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 10px 20px; border-radius: 999px;
    font-size: .85em; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 50;
  }
  .toast.show { opacity: 1; }
</style>

<header>
  <h1>📦 注文管理</h1>
  <button type="button" class="reload-btn" onclick="loadData()">🔄 更新</button>
</header>

<div class="tabs">
  <div class="tab active" data-tab="orders" onclick="switchTab('orders')">注文一覧</div>
  <div class="tab" data-tab="packing" onclick="switchTab('packing')">梱包リスト</div>
  <div class="tab" data-tab="summary" onclick="switchTab('summary')">商品集計</div>
</div>

<main>
  <div id="tab-orders">
    <div class="lookup">
      <input type="text" id="lookupInput" placeholder="注文番号を入力(例: 20260811-001)">
      <button type="button" onclick="openEditByNumber()">✏️ 呼び出して修正</button>
    </div>
    <div class="filters">
      <select id="statusFilter" onchange="renderOrders()">
        <option value="">すべてのステータス</option>
      </select>
      <input type="text" id="searchBox" placeholder="名前・注文番号で検索" oninput="renderOrders()">
    </div>
    <div id="ordersList"><div class="loading"><div class="spinner"></div>読み込み中…</div></div>
  </div>

  <div id="tab-packing" style="display:none;">
    <p style="font-size:.78em;color:var(--muted);margin-bottom:10px;">
      「入金確認済」の注文をお客様ごとに表示します。梱包が終わったら「梱包済にする」を押してください。
    </p>
    <div id="packingList"></div>
  </div>

  <div id="tab-summary" style="display:none;">
    <p style="font-size:.78em;color:var(--muted);margin-bottom:10px;">
      未対応・入金確認済の注文に含まれる商品の合計数量です。仕入れ・在庫確認にご利用ください。
    </p>
    <div id="summaryBox"></div>
  </div>
</main>

<!-- 注文修正モーダル -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <h3>✏️ 注文修正 <span id="editOrderId" style="color:var(--green-dark);"></span></h3>

    <label>オープンチャット名(必須)</label>
    <input type="text" id="e-openChatName" maxlength="50">
    <label>LINEアカウント名</label>
    <input type="text" id="e-lineName" maxlength="50">

    <label>商品</label>
    <div id="editItems"></div>
    <button type="button" class="e-add-btn" onclick="editAddRow()">＋ 商品を追加</button>
    <div class="hint">マスター商品の価格は保存時に商品マスターの最新価格で再計算されます。自由入力商品は単価を直接入力できます(空欄なら価格未定)。</div>
    <div class="e-total">合計 <span id="editTotal">0</span> 元<span id="editTotalNote"></span></div>

    <label>備考</label>
    <textarea id="e-note" rows="2" maxlength="300"></textarea>

    <div class="btns">
      <button type="button" class="btn-back" onclick="closeEdit()">キャンセル</button>
      <button type="button" class="btn-ok" id="editSaveBtn" onclick="saveEdit()">保存する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  var ADMIN_KEY = '<?= adminKey ?>';
  var DATA = { statuses: [], orders: [] };

  loadData();

  function loadData() {
    document.getElementById('ordersList').innerHTML =
      '<div class="loading"><div class="spinner"></div>読み込み中…</div>';
    google.script.run
      .withSuccessHandler(function (data) {
        DATA = data;
        var sel = document.getElementById('statusFilter');
        var current = sel.value;
        sel.innerHTML = '<option value="">すべてのステータス</option>' +
          data.statuses.map(function (s) { return '<option>' + s + '</option>'; }).join('');
        sel.value = current;
        renderAll();
      })
      .withFailureHandler(function (err) {
        document.getElementById('ordersList').innerHTML =
          '<div class="empty">読み込みに失敗しました: ' + escapeHtml(err.message) + '</div>';
      })
      .getAdminData(ADMIN_KEY);
  }

  function renderAll() {
    renderOrders();
    renderPacking();
    renderSummary();
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.tab === name);
    });
    ['orders', 'packing', 'summary'].forEach(function (t) {
      document.getElementById('tab-' + t).style.display = t === name ? 'block' : 'none';
    });
  }

  // ---- 注文一覧 ----
  function renderOrders() {
    var status = document.getElementById('statusFilter').value;
    var q = document.getElementById('searchBox').value.trim().toLowerCase();
    var list = DATA.orders.filter(function (o) {
      if (status && o.status !== status) return false;
      if (q && (o.openChatName + o.lineName + o.orderId).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    var box = document.getElementById('ordersList');
    if (list.length === 0) {
      box.innerHTML = '<div class="empty">該当する注文がありません</div>';
      return;
    }
    box.innerHTML = list.map(function (o) {
      var items = o.items.map(function (it) {
        return '<li><span>' + escapeHtml(it.name) + ' × ' + it.qty + '</span><span>' +
          (it.subtotal === '' ? '<span class="badge custom">価格未定</span>' : it.subtotal.toLocaleString() + '元') +
          '</span></li>';
      }).join('');
      return '<div class="order-card">' +
        '<div class="oc-head"><div>' +
          '<div class="oc-id">' + escapeHtml(o.orderId) + ' ・ ' + escapeHtml(o.orderedAt) +
            (o.enteredBy === '管理者' ? '<span class="badge admin">管理者入力</span>' : '') + '</div>' +
          '<div class="oc-name">' + escapeHtml(o.openChatName) + '</div>' +
          (o.lineName ? '<div class="oc-line">LINE: ' + escapeHtml(o.lineName) + '</div>' : '') +
        '</div>' +
        '<select class="status-select st-' + o.status + '" onchange="changeStatus(\'' + o.orderId + '\', this)">' +
          DATA.statuses.map(function (s) {
            return '<option' + (s === o.status ? ' selected' : '') + '>' + s + '</option>';
          }).join('') +
        '</select></div>' +
        '<ul class="oc-items">' + items + '</ul>' +
        '<div class="oc-total">合計 ' + o.total.toLocaleString() + ' 元' + (o.hasCustomItems ? ' ＋価格未定分' : '') + '</div>' +
        (o.note ? '<div class="oc-note">📝 ' + escapeHtml(o.note) + '</div>' : '') +
        '<button type="button" class="edit-btn" onclick="openEdit(\'' + o.orderId + '\')">✏️ この注文を修正</button>' +
      '</div>';
    }).join('');
  }

  function changeStatus(orderId, sel) {
    var status = sel.value;
    sel.disabled = true;
    google.script.run
      .withSuccessHandler(function () {
        sel.disabled = false;
        sel.className = 'status-select st-' + status;
        var o = DATA.orders.find(function (x) { return x.orderId === orderId; });
        if (o) o.status = status;
        renderPacking();
        renderSummary();
        showToast(orderId + ' を「' + status + '」に変更しました');
      })
      .withFailureHandler(function (err) {
        sel.disabled = false;
        showToast('変更に失敗: ' + err.message);
        loadData();
      })
      .updateOrderStatus(ADMIN_KEY, orderId, status);
  }

  // ---- 梱包リスト ----
  function renderPacking() {
    var list = DATA.orders.filter(function (o) { return o.status === '入金確認済'; });
    var box = document.getElementById('packingList');
    if (list.length === 0) {
      box.innerHTML = '<div class="empty">梱包待ち(入金確認済)の注文はありません</div>';
      return;
    }
    box.innerHTML = list.map(function (o) {
      var items = o.items.map(function (it) {
        return '<li><span>' + escapeHtml(it.name) + '</span><span class="pack-qty">× ' + it.qty + '</span></li>';
      }).join('');
      return '<div class="pack-card">' +
        '<div class="pack-name">' + escapeHtml(o.openChatName) + '</div>' +
        '<div class="oc-id">' + escapeHtml(o.orderId) +
          (o.lineName ? ' ・ LINE: ' + escapeHtml(o.lineName) : '') + '</div>' +
        '<ul class="pack-items">' + items + '</ul>' +
        (o.note ? '<div class="oc-note">📝 ' + escapeHtml(o.note) + '</div>' : '') +
        '<button type="button" class="pack-done-btn" onclick="markPacked(\'' + o.orderId + '\', this)">✅ 梱包済にする</button>' +
      '</div>';
    }).join('');
  }

  function markPacked(orderId, btn) {
    btn.disabled = true;
    btn.textContent = '更新中…';
    google.script.run
      .withSuccessHandler(function () {
        var o = DATA.orders.find(function (x) { return x.orderId === orderId; });
        if (o) o.status = '梱包済';
        renderAll();
        showToast(orderId + ' を梱包済にしました');
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = '✅ 梱包済にする';
        showToast('変更に失敗: ' + err.message);
      })
      .updateOrderStatus(ADMIN_KEY, orderId, '梱包済');
  }

  // ---- 商品集計 ----
  function renderSummary() {
    var target = DATA.orders.filter(function (o) {
      return o.status === '未対応' || o.status === '入金確認済';
    });
    var agg = {};
    target.forEach(function (o) {
      o.items.forEach(function (it) {
        if (!agg[it.name]) agg[it.name] = { qty: 0, amount: 0, noPrice: false };
        agg[it.name].qty += it.qty;
        if (it.subtotal === '') agg[it.name].noPrice = true;
        else agg[it.name].amount += it.subtotal;
      });
    });
    var names = Object.keys(agg).sort();
    var box = document.getElementById('summaryBox');
    if (names.length === 0) {
      box.innerHTML = '<div class="empty">対象の注文がありません</div>';
      return;
    }
    var totalAmount = 0;
    var rows = names.map(function (n) {
      totalAmount += agg[n].amount;
      return '<tr><td>' + escapeHtml(n) + '</td><td>' + agg[n].qty + '</td><td>' +
        (agg[n].noPrice ? agg[n].amount.toLocaleString() + '元 ＋α' : agg[n].amount.toLocaleString() + '元') +
        '</td></tr>';
    }).join('');
    box.innerHTML = '<table class="sum-table">' +
      '<tr><th>商品名</th><th style="text-align:right;">数量</th><th>金額</th></tr>' + rows +
      '<tr><td style="font-weight:700;">合計</td><td></td><td style="font-weight:700;color:var(--accent);">' +
      totalAmount.toLocaleString() + '元</td></tr></table>';
  }

  // ---- 注文修正(暗号キー必須・サーバー側でも検証) ----
  var editingOrderId = null;
  var editRowSeq = 0;

  function openEditByNumber() {
    var id = document.getElementById('lookupInput').value.trim();
    if (!id) { showToast('注文番号を入力してください'); return; }
    openEdit(id);
  }

  function openEdit(orderId) {
    showToast('注文を呼び出しています…');
    google.script.run
      .withSuccessHandler(function (order) {
        editingOrderId = order.orderId;
        document.getElementById('editOrderId').textContent = order.orderId;
        document.getElementById('e-openChatName').value = order.openChatName;
        document.getElementById('e-lineName').value = order.lineName;
        document.getElementById('e-note').value = order.note;
        document.getElementById('editItems').innerHTML = '';
        order.items.forEach(function (it) { editAddRow(it); });
        if (order.items.length === 0) editAddRow();
        updateEditTotal();
        document.getElementById('editOverlay').classList.add('show');
      })
      .withFailureHandler(function (err) { showToast(err.message); })
      .getOrderById(ADMIN_KEY, orderId);
  }

  function closeEdit() {
    document.getElementById('editOverlay').classList.remove('show');
    editingOrderId = null;
  }

  function productOptions(selectedId) {
    var opts = (DATA.products || []).map(function (p) {
      return '<option value="' + escapeHtml(p.id) + '"' + (p.id === selectedId ? ' selected' : '') + '>' +
        escapeHtml(p.name) + (p.price === '' ? '' : '(' + p.price + '元)') + '</option>';
    });
    opts.push('<option value=""' + (selectedId ? '' : ' selected') + '>✏️ 自由入力(リストにない商品)</option>');
    return opts.join('');
  }

  function editAddRow(item) {
    item = item || { productId: '', name: '', qty: 1, price: '' };
    var id = 'e-row-' + (editRowSeq++);
    var div = document.createElement('div');
    div.className = 'e-row';
    div.id = id;
    div.innerHTML =
      '<select class="e-prod" onchange="onEditProdChange(\'' + id + '\')">' +
        productOptions(item.productId) + '</select>' +
      '<input type="text" class="e-name" placeholder="商品名(自由入力)" maxlength="60" ' +
        'value="' + escapeHtml(item.productId ? '' : item.name) + '">' +
      '<div class="e-sub">' +
        '<input type="tel" class="e-qty" value="' + (Number(item.qty) || 1) + '" oninput="updateEditTotal()">' +
        '<input type="tel" class="e-price" placeholder="単価(元)" value="' +
          (item.productId ? '' : escapeHtml(String(item.price))) + '" oninput="updateEditTotal()">' +
        '<div class="e-price-fixed"></div>' +
        '<button type="button" class="e-del" onclick="editDelRow(\'' + id + '\')">✕</button>' +
      '</div>';
    document.getElementById('editItems').appendChild(div);
    onEditProdChange(id);
  }

  function editDelRow(id) {
    var el = document.getElementById(id);
    if (el) el.remove();
    updateEditTotal();
  }

  function onEditProdChange(id) {
    var row = document.getElementById(id);
    var prodId = row.querySelector('.e-prod').value;
    var isCustom = prodId === '';
    row.querySelector('.e-name').style.display = isCustom ? 'block' : 'none';
    row.querySelector('.e-price').style.display = isCustom ? 'block' : 'none';
    var fixed = row.querySelector('.e-price-fixed');
    if (isCustom) {
      fixed.style.display = 'none';
    } else {
      var p = (DATA.products || []).find(function (x) { return x.id === prodId; });
      fixed.style.display = 'block';
      fixed.textContent = (p && p.price !== '') ? '単価 ' + p.price + '元' : '価格未定';
    }
    updateEditTotal();
  }

  function collectEditItems() {
    var items = [];
    document.querySelectorAll('#editItems .e-row').forEach(function (row) {
      var prodId = row.querySelector('.e-prod').value;
      var qty = parseInt(row.querySelector('.e-qty').value, 10) || 0;
      if (qty <= 0) return;
      if (prodId) {
        items.push({ productId: prodId, name: '', qty: qty, price: '' });
      } else {
        var name = row.querySelector('.e-name').value.trim();
        if (!name) return;
        var priceRaw = row.querySelector('.e-price').value.trim();
        var price = (priceRaw === '' || isNaN(Number(priceRaw))) ? '' : Number(priceRaw);
        items.push({ productId: '', name: name, qty: qty, price: price });
      }
    });
    return items;
  }

  function updateEditTotal() {
    var total = 0, hasNoPrice = false;
    collectEditItems().forEach(function (it) {
      if (it.productId) {
        var p = (DATA.products || []).find(function (x) { return x.id === it.productId; });
        if (p && p.price !== '') total += p.price * it.qty; else hasNoPrice = true;
      } else {
        if (it.price === '') hasNoPrice = true; else total += it.price * it.qty;
      }
    });
    document.getElementById('editTotal').textContent = total.toLocaleString();
    document.getElementById('editTotalNote').textContent = hasNoPrice ? '(＋価格未定分)' : '';
  }

  function saveEdit() {
    var name = document.getElementById('e-openChatName').value.trim();
    if (!name) { showToast('オープンチャット名を入力してください'); return; }
    var items = collectEditItems();
    if (items.length === 0) { showToast('商品を1つ以上入力してください'); return; }

    var btn = document.getElementById('editSaveBtn');
    btn.disabled = true;
    btn.textContent = '保存中…';
    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        btn.textContent = '保存する';
        closeEdit();
        showToast(res.orderId + ' を修正しました');
        loadData();
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = '保存する';
        showToast('保存に失敗: ' + err.message);
      })
      .updateOrder(ADMIN_KEY, editingOrderId, {
        openChatName: name,
        lineName: document.getElementById('e-lineName').value.trim(),
        note: document.getElementById('e-note').value.trim(),
        items: items
      });
  }

  // ---- 共通 ----
  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2500);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
</script>
